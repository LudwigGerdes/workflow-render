name: Bug report
description: Something renders wrong, crashes, or does not match what n8n shows
labels: [bug]
body:
  - type: input
    id: tool-version
    attributes:
      label: workflow-render version
      description: The commit or package version you ran (`git rev-parse --short HEAD` in a checkout).
      placeholder: 0.1.0 / a6a7014
    validations:
      required: true
  - type: input
    id: n8n-version
    attributes:
      label: n8n version
      description: The n8n release the workflow or execution came from.
      placeholder: 2.38.1
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: v22.12.0
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Minimal workflow or execution JSON
      description: The smallest JSON that shows the problem. Remove credentials, instance ids and anything private first.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to see (a screenshot from n8n helps).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead — the command you ran, its output, and the rendered SVG/PNG or a screenshot of the element.
    validations:
      required: true
